<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10111A" />
    <title>Heidi Simelius</title>
    <!--
      data-rh marks this as a react-helmet-async managed tag, so PageMeta REPLACES it
      instead of appending a second description meta. Without it every page shipped
      two of them and crawlers took this static one.
      The content stays as the site-wide fallback for crawlers that do not run JS.
    -->
    <meta
      data-rh="true"
      name="description"
      content="Heidi Simelius - Laulaja, lauluntekijä ja esiintyjä"
    />
    <meta name="author" content="Heidi Simelius" />

    <!-- Favicon and Manifest Links -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Tags carrying data-rh="true" are replaced per page by PageMeta (see the note on
      the description above). og:type and og:image are page-invariant, so they stay
      unmarked — Helmet never renders them and would otherwise strip them.
    -->
    <meta property="og:type" content="website" />
    <meta
      data-rh="true"
      property="og:url"
      content="https://www.heidisimelius.fi/"
    />
    <meta
      data-rh="true"
      property="og:title"
      content="Heidi Simelius | Laulaja, lauluntekijä ja esiintyjä"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="Tervetuloa Heidi Simeliuksen virallisille sivuille. Tutustu musiikkiin, tuleviin keikkoihin, teatteritöihin ja bilebändiin."
    />
    <meta
      property="og:image"
      content="https://www.heidisimelius.fi/images/pressikuvat-Titta-Toivanen/Heidi-Simelius-kuvat-Titta-Toivanen-1.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      data-rh="true"
      property="twitter:url"
      content="https://www.heidisimelius.fi/"
    />
    <meta
      data-rh="true"
      property="twitter:title"
      content="Heidi Simelius | Laulaja, lauluntekijä ja esiintyjä"
    />
    <meta
      data-rh="true"
      property="twitter:description"
      content="Tervetuloa Heidi Simeliuksen virallisille sivuille. Tutustu musiikkiin, tuleviin keikkoihin, teatteritöihin ja bilebändiin."
    />
    <meta
      property="twitter:image"
      content="https://www.heidisimelius.fi/images/pressikuvat-Titta-Toivanen/Heidi-Simelius-kuvat-Titta-Toivanen-1.jpg"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
